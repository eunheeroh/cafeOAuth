<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 회원가입</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- [페이지 상단] 카페 헤더 영역 -->
    <header class="header">
      <div class="logo" style="font-size: 3rem;">☕</div>
      <h1>바이브 카페</h1>
      <p class="subtitle">회원가입하고 더 편하게 주문하세요</p>
    </header>

    <section class="login-box">
      <!-- [회원가입 폼] 브라우저 기본 유효성 검사 비활성화(novalidate) -->
      <form id="signupForm" class="auth-form" novalidate>
        <!-- 1. 이름 -->
        <div class="form-group">
          <label for="signupName">이름 *</label>
          <input type="text" id="signupName" placeholder="이름을 입력해주세요" autocomplete="name">
        </div>

        <!-- 2. 이메일 -->
        <div class="form-group">
          <label for="signupEmail">이메일 *</label>
          <input type="email" id="signupEmail" placeholder="example@email.com" autocomplete="email">
        </div>

        <!-- 3. 비밀번호 -->
        <div class="form-group">
          <label for="signupPassword">비밀번호 * (6자 이상)</label>
          <input type="password" id="signupPassword" placeholder="비밀번호를 입력해주세요" autocomplete="new-password">
        </div>

        <!-- 4. 비밀번호 확인 -->
        <div class="form-group">
          <label for="signupPasswordConfirm">비밀번호 확인 *</label>
          <input type="password" id="signupPasswordConfirm" placeholder="비밀번호를 한 번 더 입력해주세요" autocomplete="new-password">
        </div>

        <button type="submit" id="signupBtn" class="auth-submit-btn">회원가입</button>
      </form>

      <!-- 구분선 -->
      <div class="auth-divider"><span>또는</span></div>

      <!-- 구글로 가입 (구글은 첫 로그인 시 자동으로 회원가입됩니다) -->
      <button type="button" id="googleSignupBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.1315.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Google 계정으로 가입</span>
      </button>

      <!-- 안내 / 오류 메시지 -->
      <p id="signupMessage" class="login-message"></p>

      <!-- 로그인 페이지로 이동 -->
      <p class="auth-switch">이미 회원이신가요? <a href="login.html">로그인</a></p>
    </section>
  </main>

  <!-- Supabase JS v2 CDN 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase 설정(공통) -->
  <script src="supabase-config.js"></script>
  <!-- 회원가입 페이지 자바스크립트 -->
  <script src="signup.js"></script>
</body>
</html>
